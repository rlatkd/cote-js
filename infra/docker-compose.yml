# CoteJS 로컬 인프라 — 도커는 인프라 서비스만 담는다(개발용 세팅).
# 앱(api·web)은 호스트에서 네이티브 실행: services/api → ./gradlew bootRun, services/web → pnpm dev.
# 사용: infra/ 에서  docker compose up -d          (후속: redis, kafka 추가 예정)
# 이미지 버전은 LTS/안정판 기준.

services:
  postgres:
    build: ./postgres
    image: cotejs-postgres:16
    container_name: cotejs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cotejs
      POSTGRES_PASSWORD: cotejs
      POSTGRES_DB: cotejs
    ports:
      - "5432:5432"
    volumes:
      - cotejs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotejs -d cotejs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cotejs-pgdata:
