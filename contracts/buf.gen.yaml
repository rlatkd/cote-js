# 코드 생성 설정 — `cd contracts && buf generate`
#
# 플러그인은 전부 local(로컬 설치본): BSR 원격 플러그인을 쓰지 않는다 —
# 편의를 위해 외부 SaaS에 의존하지 않기 위함(사용자 방침, ADR-0011).
#   설치: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#
# 생성물은 커밋한다(web의 schema.d.ts와 같은 관행) — 빌드에 도구가 필요 없고
# 계약 변경이 PR diff에 드러난다.
version: v2

plugins:
  # Go(judge) — 플러그인이 독립 바이너리로 존재한다.
  - local: protoc-gen-go
    out: ../services/judge/gen
    opt: paths=source_relative

  # JVM(api) — Java 생성기는 독립 플러그인이 아니라 protoc에 내장돼 있어
  # protoc 바이너리를 요구한다(PATH에 필요, RUN.md 참조).
  # Kotlin DSL(--kotlin_out)은 Java 생성물에 얹는 빌더 설탕일 뿐이고,
  # 생성된 Java 클래스는 Kotlin에서 그대로 쓸 수 있어 Java만 생성한다.
  - protoc_builtin: java
    out: ../services/api/src/main/proto-gen
