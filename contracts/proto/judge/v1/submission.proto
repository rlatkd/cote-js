// 실행 요청 — api(run·submit 레인)·problem(batch 레인, M3~) → judge.
// 토픽: submission.run / submission.submit / submission.batch (레인 = 토픽 분리, ADR-0006·0009)
// 초안(Draft): judge 구현 착수 시 실코드로 검증하며 확정한다.
syntax = "proto3";

package judge.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/trace.proto";

option java_package = "com.cotejs.contracts.judge.v1";
option java_multiple_files = true;
// go_package은 "생성물이 놓이는 곳"을 가리킨다(계약 원본 위치가 아니라).
// 생성 경로는 contracts/buf.gen.yaml이 정한다.
option go_package = "github.com/rlatkd/cotejs/services/judge/gen/judge/v1;judgev1";

message Submission {
  // 코어 DB(submission.id)의 식별자. 결과 매칭 키.
  int64 submission_id = 1;
  int64 problem_id = 2;

  // 언어 식별자(예: "python"). 첫 슬라이스 언어 범위가 보류 결정이라 enum 대신
  // 문자열 초안 — judge 착수 시 enum 전환 여부 확정.
  string language = 3;
  string source_code = 4;

  // 제한 조건 — DB의 표시용 문자열("1초")이 아닌 수치. api가 발행 시 변환한다.
  uint32 time_limit_ms = 5;
  uint32 memory_limit_mb = 6;

  // claim-check(ADR-0009 결정 2): 테스트 데이터는 MinIO 번들, 메시지엔 참조만.
  // judge는 sha256 기준 로컬 캐시 — 해시가 다르면 재다운로드(캐시 무효화 내장).
  string test_bundle_key = 7;
  string test_bundle_sha256 = 8;

  // UTC 절대시각(ADR-0015). 존 해석의 여지가 없는 타입만 경계에 둔다.
  google.protobuf.Timestamp submitted_at = 9;

  // 이 실행 요청이 속한 요청 흐름(ADR-0017). 로그·추적이 서비스를 건너 이어진다.
  common.v1.TraceContext trace = 10;
}
