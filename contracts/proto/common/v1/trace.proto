// 상관관계(추적) 컨텍스트 — 한 요청이 여러 서비스를 지날 때 **같은 실을 꿰는** 식별자.
//
// 왜 계약에 두는가: web→api→Kafka→judge→Kafka→api를 지나는 한 건을 지금은
// 각 서비스 로그에서 `submission_id`로 눈으로 이어붙여야 한다. 서비스가 늘수록
// 불가능해지고, 각자 다른 필드명을 쓰기 시작하면 영영 이어지지 않는다.
//
// 필드 형식은 W3C Trace Context 표준을 따른다 — 표준을 쓰면 나중에 OpenTelemetry를
// 얹을 때 우리 포맷을 번역할 필요가 없다.
syntax = "proto3";

package common.v1;

option java_package = "com.cotejs.contracts.common.v1";
option java_multiple_files = true;
option go_package = "github.com/rlatkd/cotejs/services/judge/gen/common/v1;commonv1";

// 한 요청 흐름 전체를 식별하는 컨텍스트. 모든 서비스 간 메시지가 이것을 실어 나른다.
message TraceContext {
  // 흐름 전체의 id(16바이트 hex, 32자). 요청 진입점에서 한 번 생성되고 끝까지 불변.
  string trace_id = 1;
  // 이 메시지를 만든 구간의 id(8바이트 hex, 16자). 서비스마다 새로 만든다.
  string span_id = 2;
  // 이 구간을 만들어낸 상위 구간. 비어 있으면 흐름의 시작점.
  string parent_span_id = 3;
}
