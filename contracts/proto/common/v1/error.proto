// 실패의 공통 표현 — "무엇이 실패했는가"가 아니라 **"받는 쪽이 무엇을 해야 하는가"**를 담는다.
//
// 왜 계약에 두는가: 지금 judge는 실패를 문자열 하나(`error_message`)로 보낸다.
// 받는 쪽은 그 문자열을 보고 재시도할지, 사용자에게 보여줄지, 운영자를 부를지를
// **스스로 추측**해야 한다. 추측이 서비스마다 달라지면 같은 실패가 다르게 처리된다.
// 판단에 필요한 정보를 발신자가 **명시**하게 만드는 것이 이 메시지의 목적이다.
syntax = "proto3";

package common.v1;

option java_package = "com.cotejs.contracts.common.v1";
option java_multiple_files = true;
option go_package = "github.com/rlatkd/cotejs/services/judge/gen/common/v1;commonv1";

// 실패의 귀속 — **누구의 잘못인가**. 처리 방식이 여기서 갈린다.
enum FaultOrigin {
  FAULT_ORIGIN_UNSPECIFIED = 0;
  // 요청자 귀책(잘못된 입력·규칙 위반). 재시도해도 같다 — 사용자에게 알린다.
  FAULT_ORIGIN_CALLER = 1;
  // 처리자 귀책(내부 오류·의존 장애). 사용자 코드는 멀쩡하다 — 운영자가 봐야 한다.
  FAULT_ORIGIN_PROVIDER = 2;
}

message Error {
  // 기계가 분기하는 안정 식별자(예: "BUNDLE_HASH_MISMATCH"). 문구는 바뀌어도 이건 불변.
  string code = 1;
  // 사람이 읽는 설명. 분기 조건으로 쓰지 말 것.
  string message = 2;
  FaultOrigin origin = 3;
  // **재시도해도 되는가.** 발신자만 알 수 있는 정보다 — 수신자의 추측에 맡기지 않는다.
  bool retryable = 4;
  // 진단 부속 정보(스택·컴파일 로그 등). 크기가 커질 수 있어 표시·저장 정책은 수신자 몫.
  string detail = 5;
}
