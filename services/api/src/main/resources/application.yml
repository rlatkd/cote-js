# api 설정 — 로컬 기본값 + 환경변수 오버라이드(도커 컴포즈에서 주입).
server:
  port: 4000

logging:
  pattern:
    # 모든 로그 라인에 요청 상관관계 id를 찍는다 — OTel 에이전트가 요청·컨슈머 단위로
    # MDC에 넣는 trace_id가 곧 "트랜잭션을 찾아가는 reqId"다. 이 id 하나로
    # web(Next 콘솔)→api→judge 로그를 관통 검색한다(ADR-0017·0018).
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%X{trace_id:-}]){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

spring:
  webflux:
    base-path: /api # 전역 prefix
  data:
    redis: # SSE 팬아웃 pub/sub + rate limit (ADR-0006)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  r2dbc: # 런타임(논블로킹)
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/cotejs}
    username: ${DB_USER:cotejs}
    password: ${DB_PASSWORD:cotejs}
  flyway: # 마이그레이션(기동 시, JDBC 경유)
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/cotejs}
    user: ${DB_USER:cotejs}
    password: ${DB_PASSWORD:cotejs}
    # 기본(dev) = 스키마 + 더미데이터(R__ 시드). 운영은 application-prod.yml이 migration만 남긴다
    locations: classpath:db/migration, classpath:db/seed
    # 시드 SQL의 $tag${...} 달러 인용이 ${placeholder}로 오인되는 것 방지(플레이스홀더 미사용)
    placeholder-replacement: false

# judge 파이프라인(ADR-0009·0011) — Kafka 제출/결과 토픽 + 테스트 번들 스토리지
cotejs:
  # 인증(ADR-0019) — 카카오 자격 증명은 services/api/.env(커밋 금지)에서 bootRun이 주입
  auth:
    web-origin: ${WEB_ORIGIN:http://localhost:3000}
    jwt:
      # 개발 기본값 — 운영은 JWT_SECRET 필수(이 값이 곧 세션 위조 가능 여부다)
      secret: ${JWT_SECRET:cotejs-dev-only-secret-0123456789abcdef}
      access-ttl: 1h   # 탈취 노출 창의 상한 — 즉시 무효화 불가의 수용 비용(ADR-0019)
      refresh-ttl: 14d # 무활동 시 재로그인까지의 기간
      state-ttl: 10m   # 카카오 로그인 절차가 걸릴 수 있는 최대 시간
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:4000/api/auth/callback/kakao}
  kafka:
    brokers: ${KAFKA_BROKERS:localhost:9092}
    result-topic: ${KAFKA_RESULT_TOPIC:submission.result}
    group: ${KAFKA_GROUP:api-result-consumers}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:cotejs}
    secret-key: ${STORAGE_SECRET_KEY:cotejs-dev}
    bucket: ${STORAGE_BUCKET:testdata}
    region: ${STORAGE_REGION:us-east-1} # MinIO는 리전 개념이 없지만 S3 SDK가 요구한다

springdoc:
  api-docs:
    path: /v3/api-docs # base-path 적용 → 실제 경로 /api/v3/api-docs
