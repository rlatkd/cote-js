# CI 게이트 — **규약을 사람의 규율이 아니라 시스템으로 강제하는 지점**([ADR-0017] 논의).
#
# 지금까지 테스트·계약 검사는 누군가 손으로 칠 때만 돌았다. 여기서 자동으로 돌아야
# "어기면 빌드가 깨진다"가 성립한다. 서비스 3개 규모에서 서비스 메시·정책 엔진 같은
# 무거운 강제 수단 대신 가장 값싸게 같은 효과를 내는 층이 CI다.
#
# 서비스별로 잡을 나눈 이유: 하나가 깨져도 나머지 결과를 볼 수 있고(원인 분리),
# 변경된 서비스만 도는 최적화를 나중에 얹을 수 있다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 이전 실행을 취소한다(자원 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 읽기만 하면 된다 — 토큰 권한은 필요한 만큼만.
permissions:
  contents: read

jobs:
  contracts:
    name: 계약 (buf lint · breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking이 이전 커밋과 대조하려면 히스토리가 필요하다.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # 생성물 동기화 검사에 Go 플러그인이 필요하다(protoc는 JVM 생성기용).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/judge/go.sum
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - uses: arduino/setup-protoc@v3
        with:
          version: "33.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint
        working-directory: contracts
        run: buf lint
      # Schema Registry를 보류한 대신 이것이 스키마 진화를 강제한다([ADR-0011]).
      # **push에서도 돌려야 한다** — 이 저장소는 main 직접 푸시가 주 흐름이라
      # PR 조건만 걸어두면 검사가 영영 실행되지 않는다(실제로 그랬다).
      - name: 호환성 파괴 검사 (PR — 대상 브랜치 기준)
        if: github.event_name == 'pull_request'
        working-directory: contracts
        run: buf breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=contracts"

      - name: 호환성 파괴 검사 (push — 직전 커밋 기준)
        if: github.event_name == 'push'
        working-directory: contracts
        run: |
          # 최초 커밋에는 비교 대상이 없다.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            buf breaking --against "../.git#ref=HEAD~1,subdir=contracts"
          else
            echo "직전 커밋이 없어 건너뜀"
          fi

      # 생성물을 커밋하는 방식([ADR-0011])의 알려진 약점: .proto만 고치고 재생성을
      # 잊으면 원본과 생성 코드가 어긋난 채 빌드가 통과한다. 여기서 재생성해 보고
      # 차이가 나면 실패시킨다 — "생성 후 커밋" 규율을 사람이 아닌 CI가 지킨다.
      - name: 생성물 동기화 검사
        run: |
          cd contracts && buf generate && cd ..
          # --ignore-cr-at-eol: 저장소 줄바꿈 정규화(.gitattributes)가 끝나기 전에도
          # Windows/Linux 차이로 오탐하지 않게 한다.
          if ! git diff --quiet --ignore-cr-at-eol -- services/judge/gen services/api/src/main/proto-gen; then
            echo "::error::생성물이 .proto와 어긋납니다. 'cd contracts && buf generate' 후 커밋하세요."
            git diff --stat --ignore-cr-at-eol -- services/judge/gen services/api/src/main/proto-gen
            exit 1
          fi

  judge:
    name: judge (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/judge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/judge/go.sum
      - run: go vet ./...
      - run: go build ./...
      # 단위 테스트만 — 샌드박스 실채점은 Docker 러너 이미지가 필요해 여기서 돌리지 않는다
      # (verification.md의 수동 절차로 남긴다. flaky 위험 회피 — ADR-0016).
      - run: go test ./...

  api:
    name: api (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 통합 테스트(Testcontainers)는 Docker가 필요한데 ubuntu 러너에 기본 탑재돼 있다.
      - run: ./gradlew build --no-daemon

  web:
    name: web (Next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      # 버전은 services/web/package.json의 packageManager 필드에서 읽는다 —
      # 워크플로에 또 적으면 로컬과 어긋날 수 있어 진실원을 하나로 둔다.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: services/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # next build가 contract-check.ts를 컴파일하므로, api 계약과 web 모델이 어긋나면
      # 여기서 깨진다(계약 드리프트의 자동 검출 — ADR-0007).
      - run: pnpm build
